services:
  rag_api:
      build: .
      container_name: genrag_api
      ports:
        - "8000:8000"
      env_file: .env
      extra_hosts:
        - "host.docker.internal:host-gateway"

      volumes:
        - .:/app
        - /app/.venv
      
      command: >
        /app/.venv/bin/uvicorn app.main:app 
        --host 0.0.0.0 
        --port 8000 
        --reload 
        --reload-exclude "minio_data" 
        --reload-exclude "qdrant_data"

      depends_on:
        minio:
          condition: service_healthy
        qdrant:
          condition: service_healthy
      restart: unless-stopped
      deploy:
        resources:
          limits:
            memory: 512M
            cpus: '0.5'
          reservations:
            memory: 256M
            cpus: '0.25'
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s
        timeout: 10s
        retries: 3
  minio:
    image: minio/minio:latest
    ports:
      - "9010:9000" # API Port
      - "9011:9001" # Web Console (UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
  minio_config:
  qdrant_data:
  qdrant_snapshots: