services:
  rag_api:
    build: .
    container_name: genrag_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file: .env
    depends_on:
      - minio
      - qdrant

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console (UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage