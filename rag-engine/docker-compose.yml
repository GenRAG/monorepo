services:
  rag_api:
      build: .
      container_name: genrag_api
      # Not published on the host: Caddy (below) is the only way in, over HTTPS.
      expose:
        - "8000"
      env_file: .env
      environment:
        # Passwords come from .env; ${VAR:?} makes compose refuse to start without them.
        - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
        - S3_ENDPOINT=http://minio:9000
        - QDRANT_URL=http://qdrant:6333
        - QDRANT_API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      # Production: runs the image's own CMD (uvicorn, WEB_CONCURRENCY workers).
      # No source bind mount / --reload — code changes ship via image rebuilds.

      depends_on:
        redis:
          condition: service_healthy
        minio:
          condition: service_started
        qdrant:
          condition: service_healthy
      restart: unless-stopped

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s
        timeout: 10s
        retries: 3

  caddy:
    image: caddy:2
    container_name: genrag_caddy
    # The only public entry point: HTTPS on 443. Port 80 is for the Let's Encrypt
    # challenge and redirects. Certificates live in the caddy_data volume.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rag_api
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: genrag_redis
    # No published port: only the API and worker use Redis, over the Docker
    # network. An open, passwordless 6379 gets found and abused by bots.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck's redis-cli authenticate
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  ingestion_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: genrag_worker
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # minio/minio was removed from Docker Hub (Sept 2026) and quay.io now needs
  # a login; Chainguard's build of the same MinIO server pulls anonymously.
  # It runs as uid 65532 and has no shell/curl (hence minio_init and no
  # healthcheck below).
  minio_init:
    image: busybox:1.37
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    # Bound to localhost only: reach the console through an SSH tunnel
    # (ssh -L 9011:localhost:9011 <server>), not from the internet.
    ports:
      - "127.0.0.1:9010:9000" # API Port
      - "127.0.0.1:9011:9001" # Web Console (UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    depends_on:
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    # Localhost only (dashboard via ssh -L 6333:localhost:6333 <server>), and
    # every request needs the API key.
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
  qdrant_data:
  qdrant_snapshots:
  redis_data:
  caddy_data:
  caddy_config: